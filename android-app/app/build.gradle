plugins {
    id 'com.android.application'
}

// Release signing details live in keystore.properties (not committed).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.planwise.ai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.planwise.ai'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
        // The deployed website this app opens
        buildConfigField 'String', 'SITE_URL', '"https://planwise-ai-bqcm.onrender.com/"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "PlanWise-AI-${variant.buildType.name}.apk"
        }
    }
}
